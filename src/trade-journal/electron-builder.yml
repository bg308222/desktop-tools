appId: com.desktop-tools.trade-journal
productName: 交易復盤
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
# sql.js 於執行時 require，且需讀取 .wasm 檔 → 解壓出 asar
asarUnpack:
  - '**/node_modules/sql.js/**'
# 產物用工具名稱命名，方便 justfile 搬到 ./dist/<name>.<ext>
linux:
  target:
    - AppImage
  category: Office
  artifactName: ${name}.${ext}
win:
  target:
    - portable
portable:
  artifactName: ${name}.${ext}
mac:
  target:
    - dmg
  artifactName: ${name}.${ext}
